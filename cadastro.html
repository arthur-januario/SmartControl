<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Smart Control</title>
</head>

<body>

<header>
<img src="assets/imagens/logo.png" alt="" width="120">
<h1>Cadastro de Usuário</h1>
</header>

<main>
<form>

<label for="nome">Nome Completo:</label><br>
<input
type="text"
id="nome"
name="nome"
required
>
<br><br>

<label for="email">E-mail Corporativo:</label><br>
<input
type="email"
id="email"
name="email"
required
>
<br><br>

<label for="senha">Senha:</label><br>
<input
type="password"
id="senha"
name="senha"
minlength="8"
required
>
<br><br>

<label for="nivel">Nível de Acesso:</label><br>
<select id="nivel" name="nivel" required>
<option value="">Selecione</option>
<option>Administrador</option>
<option>Gerente</option>
<option>Funcionário</option>
</select>

<br><br>

<input
type="checkbox"
id="termos"
required
>

<label for="termos">
Aceito os Termos de Uso
</label>

<br><br>

<button type="submit">
Cadastrar
</button>

</form>

<br>

<a href="index.html">Voltar ao Login</a>

</main>

<footer>

<h3>Localização da Empresa</h3>

<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d10789.623702580653!2d-43.38386233830471!3d-21.737232275788536!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x989ca8b42d819d%3A0xaf8aea526308e146!2sHavan%20Juiz%20de%20Fora!5e0!3m2!1spt-BR!2sbr!4v1785941785139!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

</footer>

</body>
</html>
