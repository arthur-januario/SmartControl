<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Smart Control</title>
</head>

<body>

<header>
<img src="assets/imagens/logo.png" alt="Logo Smart Control" width="120">
<h1>Cadastro de Usuário</h1>
</header>

<main>
<form>

<label for="nome">Nome Completo:</label><br>
<input
type="text"
id="nome"
name="nome"
required
>
<br><br>

<label for="email">E-mail Corporativo:</label><br>
<input
type="email"
id="email"
name="email"
required
>
<br><br>

<label for="senha">Senha:</label><br>
<input
type="password"
id="senha"
name="senha"
minlength="8"
required
>
<br><br>

<label for="nivel">Nível de Acesso:</label><br>
<select id="nivel" name="nivel" required>
<option value="">Selecione</option>
<option>Administrador</option>
<option>Gerente</option>
<option>Funcionário</option>
</select>

<br><br>

<input
type="checkbox"
id="termos"
required
>

<label for="termos">
Aceito os Termos de Uso
</label>

<br><br>

<button type="submit">
Cadastrar
</button>

</form>

<br>

<a href="index.html">Voltar ao Login</a>

</main>

<footer>

<h3>Localização da Empresa</h3>

<iframe
src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d236.31534071052042!2d-43.343742!3d-21.760735"
width="400"
height="300"
style="border:0;"
loading="lazy"
allowfullscreen>
</iframe>

</footer>

</body>
</html>
